<style>
/* Layout: full-screen project map (canvas) underneath; avatar and cloud float above; folders and the project viewer open on a tinted layer. All sizes follow the 1440×1024 Figma frames, scaled by --k. */
@font-face { font-family: "Inter Display"; src: url("InterDisplay-SemiBold.woff") format("woff"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Inter Display"; src: url("InterDisplay-Medium.woff") format("woff"); font-weight: 500; font-display: swap; }
:root {
  --bg: #ffffff;
  --ink: #000000;
  --ink-soft: #6d7c8e;
  --mute: #8592a5;
  --chip: #edf1f6;          /* cool panel tone */
  --chip-b: #dfe6ef;
  --tint: rgba(20, 34, 66, .34);
  --card-a: #fdfdff; --card-b: #f2f5f9;
  --bubble-a: #f4f5f6; --bubble-b: #c4d1df; --bubble-edge: #eff0f2;
  --f: "Inter Display", "Inter", system-ui, -apple-system, Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); overflow: hidden; user-select: none; -webkit-user-select: none; font-family: var(--f); -webkit-font-smoothing: antialiased; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid #6d7c8e; outline-offset: 3px; }

#buddy, #cloud { position: fixed; left: 0; top: 0; aspect-ratio: 1; touch-action: none; cursor: pointer; will-change: transform; }
#buddy { width: var(--av, 198px); z-index: 30; }
#cloud { width: var(--cl, 155px); z-index: 31; }
#buddy svg, #cloud svg { width: 100%; height: 100%; overflow: visible; display: block; }

/* speech bubble */
.anchor { position: fixed; left: 0; top: 0; z-index: 40; pointer-events: none; }
.bubble { position: relative; transform-origin: 0 100%; opacity: 0; }
.bubble.left { transform-origin: 100% 100%; }
.bubble .b { position: absolute; font: 600 calc(23px * var(--k, 1))/1 var(--f); letter-spacing: -0.01em; padding: calc(13px * var(--k, 1)) calc(23px * var(--k, 1));
  border-radius: 50px; background: linear-gradient(180deg, var(--bubble-a), var(--bubble-b)); box-shadow: inset 0 0 0 2px var(--bubble-edge); width: max-content; white-space: pre; }
.bubble .b span { background: linear-gradient(180deg, var(--ink) 35%, var(--ink-soft)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.bubble .d1, .bubble .d2 { position: absolute; border-radius: 50%; background: linear-gradient(180deg, var(--bubble-a), #d9d9d9); box-shadow: inset 0 0 0 1px var(--bubble-edge); }
.bubble .d1 { width: calc(11px * var(--k, 1)); height: calc(11px * var(--k, 1)); }
.bubble .d2 { width: calc(4px * var(--k, 1)); height: calc(4px * var(--k, 1)); }
.bubble.in { animation: pop .55s cubic-bezier(.25, 1.6, .45, 1) both; }
.bubble.in .d2 { animation: dot .3s ease-out both; }
.bubble.in .d1 { animation: dot .3s .07s ease-out both; }
.bubble.in .b { animation: pop .5s .12s cubic-bezier(.25, 1.6, .45, 1) both; }
.bubble.out { animation: fade .25s ease-in both; }
@keyframes pop { from { opacity: 0; transform: scale(.55) translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes dot { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: none; } }
@keyframes fade { to { opacity: 0; transform: scale(.9); } }

/* tinted layer for folders and viewer */
.layer { position: fixed; inset: 0; z-index: 20; background: var(--tint); backdrop-filter: blur(10px) saturate(1.1); -webkit-backdrop-filter: blur(10px) saturate(1.1); opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility .35s; }
.layer.open { opacity: 1; visibility: visible; }
.close { position: absolute; width: calc(40px * var(--k)); height: calc(40px * var(--k)); border-radius: 50%; background: linear-gradient(180deg, #f8fafc, var(--chip-b)); box-shadow: inset 0 0 0 1.5px #fff, 0 3px 10px rgba(20, 34, 66, .12); display: grid; place-items: center; transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.close:hover { transform: scale(1.12) rotate(90deg); }
.close svg { width: 40%; height: 40%; }

/* folders */
.shelf { position: absolute; left: 0; right: 0; top: calc(var(--k) * 96px); bottom: calc(var(--k) * 230px); display: flex; flex-wrap: wrap; justify-content: center; align-content: safe center;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 calc(var(--k) * 24px), #000 calc(100% - var(--k) * 24px), transparent 100%); mask-image: linear-gradient(180deg, transparent 0, #000 calc(var(--k) * 24px), #000 calc(100% - var(--k) * 24px), transparent 100%);
  gap: calc(var(--k) * 26px); overflow-y: auto; padding: calc(var(--k) * 20px) max(calc(var(--k) * 110px), env(safe-area-inset-right, 0px)) calc(var(--k) * 20px) max(calc(var(--k) * 110px), env(safe-area-inset-left, 0px));
  box-sizing: border-box; scrollbar-width: none; }
.shelf::-webkit-scrollbar { display: none; }
/* project card: soft tinted frame, header (name + tag), a square of dots drawn from the project cover, stats at the bottom */
.folder { flex: 0 0 auto; width: calc(var(--k) * 268px); position: relative; padding: calc(var(--k) * 14px) calc(var(--k) * 14px) calc(var(--k) * 16px); box-sizing: border-box; text-align: left;
  background: linear-gradient(180deg, #fff 0%, var(--fr) 100%); border-radius: calc(var(--k) * 26px); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .9), 0 18px 44px rgba(20, 34, 66, .16), 0 2px 6px rgba(20, 34, 66, .06);
  cursor: pointer; display: flex; flex-direction: column; gap: calc(var(--k) * 12px); color: #1d2433;
  opacity: 0; transform: translateY(24px) scale(.94); transition: opacity .4s ease, transform .5s cubic-bezier(.25, 1.4, .45, 1), box-shadow .3s; }
.layer.open .folder { opacity: 1; transform: none; }
.folder:hover { transform: translateY(-5px); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .9), 0 28px 60px rgba(20, 34, 66, .22), 0 2px 6px rgba(20, 34, 66, .06); }
.folder .hd { display: flex; align-items: center; gap: calc(var(--k) * 8px); min-height: calc(var(--k) * 26px); padding: 0 calc(var(--k) * 4px); }
.folder .hd { align-items: flex-start; min-height: calc(var(--k) * 36px); }
.folder .hd b { flex: 1; min-width: 0; font: 600 calc(var(--k) * 15px)/1.2 var(--f); text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.folder .dot { margin-top: calc(var(--k) * 4px); flex: 0 0 auto; width: calc(var(--k) * 10px); height: calc(var(--k) * 10px); border-radius: 50%; background: #1d2433; }
.folder .pill { flex: 0 1 auto; min-width: 0; max-width: 50%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 600 calc(var(--k) * 13px)/1 var(--f); padding: calc(var(--k) * 6px) calc(var(--k) * 10px);
  border-radius: 99px; background: var(--pill); color: var(--pt); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .7), 0 1px 3px rgba(20, 34, 66, .1); }
.folder .go { flex: 0 0 auto; width: calc(var(--k) * 18px); height: calc(var(--k) * 18px); color: #1d2433; transition: transform .35s cubic-bezier(.3, 1.6, .5, 1); }
.folder:hover .go { transform: translate(2px, -2px); }
.folder .pic { position: relative; width: 100%; aspect-ratio: 1; border-radius: calc(var(--k) * 22px); overflow: hidden; background: linear-gradient(180deg, var(--g1), var(--g2));
  box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .55), inset 0 -10px 24px rgba(20, 34, 66, .06); }
.folder .pic canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.folder .ft { display: flex; justify-content: space-between; align-items: center; gap: calc(var(--k) * 6px); padding: 0 calc(var(--k) * 4px); font: 600 calc(var(--k) * 14px)/1 var(--f); white-space: nowrap; }
.folder .ft .st { display: flex; gap: calc(var(--k) * 12px); min-width: 0; }
.folder .ft .st span { display: inline-flex; align-items: center; gap: calc(var(--k) * 5px); }
.folder .ft svg { width: calc(var(--k) * 14px); height: calc(var(--k) * 14px); flex: 0 0 auto; }

/* viewer */
.card { position: absolute; background: linear-gradient(180deg, var(--card-a), var(--card-b)); box-shadow: 0 30px 90px rgba(20, 34, 66, .3), inset 0 0 0 1.5px #fff; border-radius: calc(var(--k) * 41px); transform: scale(.96); opacity: 0; transition: transform .45s cubic-bezier(.25, 1.3, .45, 1), opacity .3s ease; }
.layer.open .card { transform: none; opacity: 1; }
.gallery { position: absolute; display: flex; gap: calc(var(--k) * 12px); }
.gallery .col { overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: calc(var(--k) * 12px); flex: 0 0 auto; scrollbar-width: none;
  border-radius: calc(var(--k) * 30px); }
.gallery .col::-webkit-scrollbar { display: none; }
.gallery .col img { width: 100%; height: auto; display: block; flex: 0 0 auto; }
.gallery img.rect { border-radius: calc(var(--k) * 30px); }
.gallery .board { position: relative; background: linear-gradient(180deg, #f1f4f8, #e8edf4); border-radius: calc(var(--k) * 30px); overflow: hidden; flex: 0 0 auto; touch-action: none; }
.gallery .bi { position: absolute; left: 0; top: 0; cursor: grab; user-select: none; -webkit-user-drag: none; transition: filter .2s; }
.gallery .bi.rect { border-radius: calc(var(--k) * 20px); }
.gallery .bi.drag { cursor: grabbing; filter: drop-shadow(0 14px 18px rgba(11, 23, 50, .22)); }
.info { position: absolute; display: flex; flex-direction: column; gap: calc(var(--k) * 6px); }
.info h2 { margin: 0; font: 600 calc(var(--k) * 23px)/1.1 var(--f); letter-spacing: -0.01em; background: linear-gradient(180deg, #000 30%, #6d7c8e); -webkit-background-clip: text; background-clip: text; color: transparent; text-wrap: balance; }
.info p { margin: 0; font: 500 calc(var(--k) * 16px)/1.2 var(--f); color: var(--mute); }
.tags { display: flex; flex-wrap: wrap; gap: calc(var(--k) * 5px) calc(var(--k) * 8px); margin-top: calc(var(--k) * 40px); }
.tags span { height: calc(var(--k) * 40px); padding: 0 calc(var(--k) * 22px); border-radius: calc(var(--k) * 35px); background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 70%), var(--tag, var(--chip-b)); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .8), 0 1px 3px rgba(20, 34, 66, .08); color: #3b4558; font: 500 calc(var(--k) * 16px)/1 var(--f); display: inline-flex; align-items: center; }
/* phone viewer: one vertical window, info left-aligned at the bottom */
.card.m { display: flex; flex-direction: column; gap: 12px; padding: 10px; box-sizing: border-box; border-radius: 30px; }
.card.m .gallery { position: static; flex: 1 1 auto; min-height: 0; flex-direction: column; gap: 10px; overflow-y: auto; overscroll-behavior: contain; border-radius: 22px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.card.m .gallery::-webkit-scrollbar { display: none; }
.card.m .gallery > img { width: 100%; height: auto; display: block; flex: 0 0 auto; }
.card.m .gallery img.rect, .card.m .gallery .board { border-radius: 22px; }
.card.m .gallery .board { touch-action: pan-y; }
.card.m .gallery .bi { touch-action: none; }
.card.m .info { position: static; flex: 0 0 auto; gap: 3px; padding: 2px 8px 6px; text-align: left; }
.card.m .info h2 { font-size: 20px; }
.card.m .info p { font-size: 14px; }
.card.m .tags { margin-top: 8px; gap: 5px; }
.card.m .tags span { height: 26px; padding: 0 11px; font-size: 12.5px; }
@media (prefers-reduced-motion: reduce) { .bubble.in, .bubble.in .b, .bubble.in .d1, .bubble.in .d2 { animation-duration: .01s; } .folder, .card, .layer { transition-duration: .01s; } }
